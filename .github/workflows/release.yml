name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install project with dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Seed config.yaml from the bundled template
        run: |
          mkdir -p config
          cp src/rag_mcp/data/config.template.yaml config/config.yaml

      - name: Run test suite
        run: pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tooling
        run: python -m pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  check-version:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install twine
        run: python -m pip install twine

      - name: Check distributions with twine
        run: python -m twine check dist/*

      - name: Read pyproject.toml version
        id: pyproject-version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check release version against tag and PyPI
        run: |
          python scripts/check_release_version.py "${{ github.ref_name }}" "${{ steps.pyproject-version.outputs.version }}"

  publish-testpypi:
    needs: check-version
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to Test PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  verify-testpypi-install:
    needs: publish-testpypi
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pow-rag-mcp from Test PyPI
        run: |
          pip install --index-url https://test.pypi.org/simple/ \
            --extra-index-url https://pypi.org/simple/ \
            pow-rag-mcp

      - name: Verify rag-mcp config succeeds with no stderr output
        run: |
          set +e
          rag-mcp config >stdout.log 2>stderr.log
          exit_code=$?
          set -e

          if [ -s stderr.log ]; then
            echo "::error::rag-mcp config produced stderr output:"
            cat stderr.log
            exit 1
          fi

          if [ "$exit_code" -ne 0 ]; then
            echo "::error::rag-mcp config exited with non-zero status $exit_code"
            exit 1
          fi

  publish-pypi:
    needs: verify-testpypi-install
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  verify-pypi-install:
    needs: publish-pypi
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install uv

      - name: "Check (a): pip install and console script"
        run: |
          pip install pow-rag-mcp

          set +e
          rag-mcp config >stdout-pip.log 2>stderr-pip.log
          exit_code=$?
          set -e

          if [ -s stderr-pip.log ]; then
            echo "::error::rag-mcp config produced stderr output:"
            cat stderr-pip.log
            exit 1
          fi

          if [ "$exit_code" -ne 0 ]; then
            echo "::error::rag-mcp config exited with non-zero status $exit_code"
            exit 1
          fi

      - name: "Check (b): uvx --from pow-rag-mcp rag-mcp config"
        run: |
          set +e
          uvx --from pow-rag-mcp rag-mcp config >stdout-uvx.log 2>stderr-uvx.log
          exit_code=$?
          set -e

          if [ -s stderr-uvx.log ]; then
            echo "::error::uvx rag-mcp config produced stderr output:"
            cat stderr-uvx.log
            exit 1
          fi

          if [ "$exit_code" -ne 0 ]; then
            echo "::error::uvx rag-mcp config exited with non-zero status $exit_code"
            exit 1
          fi

          if ! grep -q "Config" stdout-uvx.log || ! grep -q "Data" stdout-uvx.log; then
            echo "::error::uvx rag-mcp config output did not contain expected resolved config/data paths:"
            cat stdout-uvx.log
            exit 1
          fi

      - name: "Check (c): uv tool install and invoke installed executable"
        run: |
          uv tool install pow-rag-mcp
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify installed rag-mcp executable succeeds
        run: |
          set +e
          rag-mcp config >stdout-tool.log 2>stderr-tool.log
          exit_code=$?
          set -e

          if [ "$exit_code" -ne 0 ]; then
            echo "::error::installed rag-mcp config exited with non-zero status $exit_code"
            cat stderr-tool.log
            exit 1
          fi
